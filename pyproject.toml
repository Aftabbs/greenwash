[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greenwash"
dynamic = ["version"]
description = "Catch coding agents that weaken your tests and report success"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Mohammed Aftab" }]
keywords = ["ai", "coding-agent", "testing", "static-analysis", "claude-code", "git"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Aftabbs/greenwash"
Issues = "https://github.com/Aftabbs/greenwash/issues"

[project.scripts]
greenwash = "greenwash.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.version]
path = "src/greenwash/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/greenwash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
